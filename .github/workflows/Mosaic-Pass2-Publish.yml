name: Mosaic Pass 2 direct source publisher
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/Mosaic-Pass2-Publish.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Apply complete Mosaic source refactor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path
          parent = Path(".github/workflows/Mosaic-Pass2.yml").read_text()
          match = re.search(r"echo '([A-Za-z0-9+/=]+)' \| base64 -d \| gzip -d > tools/mosaic_rebrand_pass2.py", parent)
          assert match, "Pass 2 source refactor payload missing"
          data = gzip.decompress(base64.b64decode(match.group(1)))
          Path("tools/mosaic_rebrand_pass2.py").write_bytes(data)
          PY
          python3 -m py_compile tools/mosaic_rebrand_pass2.py
          python3 tools/mosaic_rebrand_pass2.py
          python3 - <<'PY'
          from pathlib import Path
          for base in ("src", "include", "data", "test", "tools", "website", "docs"):
              for path in Path(base).rglob("*"):
                  if not path.is_file() or path.suffix not in (".c", ".h", ".inc", ".json", ".jsonl", ".py", ".lua", ".md", ".mjs", ".js", ".sh", ".yml"):
                      continue
                  if "node_modules" in path.parts or "/review/" in path.as_posix():
                      continue
                  try:
                      current = path.read_text()
                  except UnicodeError:
                      continue
                  updated = current.replace("GRAND_MOSAIC_FIELD_GUIDE.md", "MOSAIC_FIELD_GUIDE.md")
                  if updated != current:
                      path.write_text(updated)
          branding = Path("test/overworld/ValidateMosaicBranding.py")
          branding.write_text("""#!/usr/bin/env python3
          from pathlib import Path
          import subprocess
          root = Path(__file__).resolve().parents[2]
          subprocess.run(["python3", "tools/mosaic_rebrand_pass2.py", "--check"], cwd=root, check=True)
          assert (root / "docs/SAVE_FILENAME_MIGRATION.md").is_file()
          assert (root / "docs/MOSAIC_FIELD_GUIDE.md").is_file()
          print("PASS: Mosaic naming and safe save-copy guide")
          """)
          PY
          sed -i 's/[[:blank:]]*$//' data/maps/Route39/scripts.inc
          python3 tools/mosaic_rebrand_pass2.py --check
          python3 - <<'PY'
          from pathlib import Path
          import shlex, subprocess
          commands = []
          for line in Path(".github/workflows/Gameplay-P0.yml").read_text().splitlines():
              line = line.strip()
              if line.startswith("python3 test/overworld/"):
                  commands.append(shlex.split(line))
          assert len(commands) >= 40
          for command in commands:
              subprocess.run(command, check=True)
          print("PASS", len(commands), "source validators")
          PY
          git diff --check
      - name: Publish real source changes now, without building again
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          while IFS= read -r -d '' file; do
            case "$file" in
              *.gba|*.sav|*.srm|*.elf|*.png|*.jpg|*.jpeg|*.bin|*.lz|*.map|*.o|*.a|*.pyc)
                git restore --staged -- "$file"
                ;;
            esac
          done < <(git diff --cached --name-only -z)
          if git diff --cached --name-only | grep -E '\.(gba|sav|srm|elf|png|jpg|jpeg|bin|lz)$'; then
            echo "Refusing compiled game or art"
            exit 1
          fi
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "Mosaic CI"
          git config user.email "mosaic-ci@users.noreply.github.com"
          git commit -m "refactor(mosaic): complete Pass 2 internal and ROM naming migration"
          git push origin HEAD:refs/heads/rebrand/pass2-direct-20261102
          echo "PASS: source refactor published without a redundant full ROM build"
