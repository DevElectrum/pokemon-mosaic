# One-shot, review-first Pass 2 migration. The self-contained script is
# decompressed into a normal, auditable Python file on the review branch.
name: Mosaic Pass 2 build-gated refactor
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/Mosaic-Pass2.yml"
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Mosaic source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Install GBA build tools
        run: |
          set -eux
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo mv "$source" "$source.disabled"
            fi
          done
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=5             build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi             libpng-dev python3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and inspect source changes
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > tools/mosaic_rebrand_pass2.py
          python3 -m py_compile tools/mosaic_rebrand_pass2.py
          python3 tools/mosaic_rebrand_pass2.py
          python3 tools/mosaic_rebrand_pass2.py --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path("test/overworld/ValidateMosaicBranding.py")
          p.write_text("""#!/usr/bin/env python3
from pathlib import Path
import subprocess
root = Path(__file__).resolve().parents[2]
subprocess.run(["python3", "tools/mosaic_rebrand_pass2.py", "--check"], cwd=root, check=True)
assert (root / "docs/SAVE_FILENAME_MIGRATION.md").is_file()
assert (root / "docs/MOSAIC_FIELD_GUIDE.md").is_file()
print("PASS: Mosaic brand, ROM name, save-copy guidance and title-art deferral")
""")
          PY
          sed -i 's/[[:blank:]]*$//' data/maps/Route39/scripts.inc
          git diff --check
          git status --short | head -n 100
      - name: Build and validate actual 32 MiB ROM
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shlex
          import subprocess
          text = Path(".github/workflows/Gameplay-P0.yml").read_text()
          commands = []
          for line in text.splitlines():
              command = line.strip()
              if command.startswith("python3 test/overworld/"):
                  commands.append(shlex.split(command))
          assert len(commands) >= 20, "Gameplay CI validator list unexpectedly small"
          for command in commands:
              subprocess.run(command, check=True)
          print("PASS:", len(commands), "maintained gameplay source validators")
          PY
          make release -j4 > "$RUNNER_TEMP/mosaic-build.log" 2>&1 || {
            grep -n -E 'Error:|error:|undefined reference|No rule|overflowed|fatal:' "$RUNNER_TEMP/mosaic-build.log" | tail -n 100 || true
            tail -n 70 "$RUNNER_TEMP/mosaic-build.log"
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          rom = Path('pokemon-mosaic-release.gba')
          assert rom.is_file()
          data = rom.read_bytes()
          assert len(data) <= 33554432
          assert data[0xA0:0xAC].rstrip(b'\0') == b'PKMN MOSAIC'
          assert data[0xAC:0xB0] == b'BPEE'
          print('PASS: Mosaic ROM', len(data), 'bytes, title and BPEE')
          PY
      - name: Website checks
        working-directory: website
        run: |
          set -euo pipefail
          npm ci
          npm test
          npm run build
      - name: Publish verified refactor to review branch
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --name-only | grep -E '\.(gba|sav|srm|elf|png|jpg|jpeg|bin|lz)$'; then
            echo "Refusing to commit compiled game or art"
            exit 1
          fi
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name "Mosaic CI"
          git config user.email "mosaic-ci@users.noreply.github.com"
          git commit -m "refactor(mosaic): complete Pass 2 code and ROM naming migration"
          git push origin HEAD:refs/heads/rebrand/pass2-20261102
          echo "PASS: verified review branch pushed"
